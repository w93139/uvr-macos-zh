[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uvr-macos-zh"
version = "0.1.0"
description = "Display-only Simplified Chinese patch for the verified UVR 5.6 arm64 Mac app"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = ["pyinstaller==6.22.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
uvr-macos-zh = "uvr_zh.installer:main"

[tool.setuptools.package-data]
uvr_zh = ["translations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
